version: 2
updates:
  # github actions
  - package-ecosystem: "github-actions"
    # checks workflow files in /.github/workflows
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "23:00"
      timezone: "Europe/Amsterdam"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm
  - package-ecosystem: "npm"
    # checks /package.json
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "23:00"
      timezone: "Europe/Amsterdam"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker
  - package-ecosystem: "docker"
    # checks /Dockerfile
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "23:00"
      timezone: "Europe/Amsterdam"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
