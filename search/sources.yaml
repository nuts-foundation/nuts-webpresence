# Sources of the nuts.nl search. This file is also the definition of "formal Nuts documentation":
# a source is formal documentation when it is listed here.
#
# Per source:
#   id, name, owner           identification; owner is TODO when unknown
#   kind                      html (default) or openapi
#   discovery                 links (follow links within urlPrefix, default) or sitemap (startUrls are sitemaps)
#   startUrls, urlPrefix      where crawling starts and which URLs belong to the source
#   index                     regexes of pages to index (default: all); other pages are only followed for links
#   exclude                   regexes of pages to neither follow nor index
#   selectors.content         element holding the main content (no navigation, header or footer)
#   selectors.remove          elements inside the content to drop
#   selectors.context         elements anywhere on the page whose text goes in front of the hierarchy (e.g. a book name)
#   detectLanguage            derive nl/en from the page text instead of <html lang>
#   labels                    default labels: type, audience, language, version, status
#   overrides                 labels per URL regex; applied in order, later ones win
#   versions                  crawl the source once per version, each with its own startUrls/urlPrefix and version label
#
# Label values:
#   category: website | documentation | specification | toepassing | wiki   (kind of source, shown per result)
#   type:     concept | guide | reference | specification | use-case
#   audience: developer | architect | devops | toepassingsontwerper | algemeen
#   language: nl | en
#   status:   actueel | draft | archief

settings:
  userAgent: "NutsSearchPoC/0.1 (+https://nuts.nl)"
  rateLimitMs: 1000
  maxPages: 500
  timeoutMs: 30000

x-fhir-ig: &fhir-ig
  owner: TODO
  kind: github
  # Page text from input/pagecontent/*.md (IG Publisher source), so the generated FHIR artifact pages
  # and the IG Publisher page header stay out. Version history and artifact intros/notes are skipped.
  exclude:
    - "/history\\.md$"
    - "-(intro|notes)\\.md$"
  detectLanguage: true
  labels: &fhir-ig-labels
    category: toepassing
    type: specification
    audience: [toepassingsontwerper, developer]
    language: en
    status: draft

x-fhir-ig-github: &fhir-ig-github
  branch: main
  include: "^input/pagecontent/[^/]+\\.md$"
  titleSeparator: " - "

sources:
  - id: nuts-nl
    name: nuts.nl
    owner: TODO
    startUrls: ["https://nuts.nl/"]
    urlPrefix: "https://nuts.nl/"
    exclude:
      - "^https://nuts\\.nl/(assets|certs|credentials|careers|bedankt|shop)/"
    selectors:
      content: "div.grow"
      # Filter buttons on overview pages (e.g. /toepassingen)
      remove: ["button"]
    labels:
      category: website
      type: concept
      audience: [algemeen]
      language: nl
      status: actueel
    overrides:
      - match: "^https://nuts\\.nl/en/"
        labels: { language: en }
      - match: "^https://nuts\\.nl/(toepassingen|use-case)/"
        labels: { type: use-case, audience: [toepassingsontwerper, algemeen] }
      - match: "^https://nuts\\.nl/(documentatie|aansluiten|starten|certs)/"
        labels: { type: guide, audience: [algemeen, developer] }

  - id: nuts-node
    name: Nuts node documentatie
    owner: TODO
    exclude:
      - "/_static/"
      - "/_sources/"
      - "/(genindex|search|py-modindex)\\.html$"
    selectors:
      content: "[itemprop=articleBody]"
      remove: [".headerlink"]
    labels:
      category: documentation
      type: guide
      audience: [developer]
      language: en
      status: actueel
    overrides:
      - match: "/pages/deployment/"
        labels: { audience: [devops] }
      - match: "/pages/integrating/"
        labels: { audience: [developer] }
      - match: "/pages/(technology|development)/"
        labels: { type: reference, audience: [developer, architect] }
      - match: "/pages/release_notes"
        labels: { type: reference, audience: [devops, developer] }
    # Only the latest minor of the last two majors; unreleased master is left out.
    versions:
      - version: v6.2
        startUrls: ["https://nuts-node.readthedocs.io/en/v6.2/"]
        urlPrefix: "https://nuts-node.readthedocs.io/en/v6.2/"
      - version: v5.4
        startUrls: ["https://nuts-node.readthedocs.io/en/v5.4/"]
        urlPrefix: "https://nuts-node.readthedocs.io/en/v5.4/"

  - id: nuts-node-api
    name: Nuts node API
    owner: TODO
    kind: openapi
    labels:
      category: documentation
      type: reference
      audience: [developer]
      language: en
      status: actueel
    versions:
      - version: v6.2
        apiPage: "https://nuts-node.readthedocs.io/en/v6.2/pages/integrating/api.html"
      - version: v5.4
        apiPage: "https://nuts-node.readthedocs.io/en/v5.4/pages/integrating/api.html"

  - id: nuts-specification
    name: Nuts specificaties (RFC's)
    owner: TODO
    kind: github
    # Text from the markdown on GitHub; results link to GitBook, which publishes this branch as the v2 space.
    github:
      repo: nuts-foundation/nuts-specification
      branch: v2
      include: "^rfc/rfc[0-9]+[^/]*\\.md$"
      url: "https://nuts-foundation.gitbook.io/v2/{path}"
    labels:
      category: specification
      type: specification
      audience: [developer, architect]
      language: en
      version: v2
      status: actueel

  - id: ig-anw
    name: Toepassing Avond-, Nacht- en Weekendzorg
    github: { <<: *fhir-ig-github, repo: nuts-foundation/nl-anw-ig, url: "https://nuts-foundation.github.io/nl-anw-ig/{name}.html" }
    <<: *fhir-ig

  - id: ig-generic-functions
    name: Toepassing Generieke functies
    github: { <<: *fhir-ig-github, repo: nuts-foundation/nl-generic-functions-ig, url: "https://nuts-foundation.github.io/nl-generic-functions-ig/{name}.html" }
    <<: *fhir-ig

  - id: ig-zorginzage
    name: Toepassing Zorginzage
    github: { <<: *fhir-ig-github, repo: nuts-foundation/nl-zorginzage-ig, url: "https://nuts-foundation.github.io/nl-zorginzage-ig/{name}.html" }
    <<: *fhir-ig
    labels: { <<: *fhir-ig-labels, status: actueel }

  - id: ig-360
    name: Toepassing Clientbeeld 360
    github: { <<: *fhir-ig-github, repo: nuts-foundation/nl-360-ig, url: "https://nuts-foundation.github.io/nl-360-ig/{name}.html" }
    <<: *fhir-ig
    labels: { <<: *fhir-ig-labels, status: actueel }

  - id: ig-eoverdracht-routering
    name: Toepassing eOverdracht routering
    github: { <<: *fhir-ig-github, repo: nuts-foundation/nl-eoverdracht-routering-ig, url: "https://nuts-foundation.github.io/nl-eoverdracht-routering-ig/{name}.html" }
    <<: *fhir-ig

  - id: ig-pzp
    name: Toepassing Proactieve Zorgplanning
    github: { <<: *fhir-ig-github, repo: nuts-foundation/nl-pzp-ig, url: "https://nuts-foundation.github.io/nl-pzp-ig/{name}.html" }
    <<: *fhir-ig

  - id: wiki
    name: Nuts wiki
    owner: TODO
    startUrls: ["https://wiki.nuts.nl/books"]
    urlPrefix: "https://wiki.nuts.nl/books"
    index:
      - "^https://wiki\\.nuts\\.nl/books/[^/]+/page/[^/]+$"
    exclude:
      - "/(export|revisions|edit|permissions|delete|copy|move|sort|create-[a-z-]+|references)(/|$)"
      # Job openings, not documentation
      - "/books/help-wanted(/|$)"
    selectors:
      content: ".page-content"
      # Book and chapter, so results show where in the wiki a page sits. Taken from the book navigation,
      # because the breadcrumb shortens long names.
      context:
        - "#book-tree a.book .entity-list-item-name"
        - "#book-tree li.list-item-chapter:has(a.page.selected) > a.chapter .entity-list-item-name"
    detectLanguage: true
    labels:
      category: wiki
      type: guide
      audience: [developer, architect]
      language: nl
      status: actueel
    overrides:
      - match: "/books/(hackathons-drafts|wg-omnichat|pocs-generieke-functies-netwerkzorg)/"
        labels: { status: draft }
      - match: "/books/[^/]*-old/"
        labels: { status: archief }
      - match: "/books/v5-v6-migration-guide/"
        labels: { audience: [devops, developer] }
      - match: "/books/(basics|kring-techniek)/"
        labels: { type: concept, audience: [architect, toepassingsontwerper] }
      - match: "/books/(pzp|generic-technical-agreements-generieke-bouwblokken)/"
        labels: { type: specification, audience: [toepassingsontwerper, architect] }
