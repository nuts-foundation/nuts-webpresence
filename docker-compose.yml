# Local search backend for the nuts.nl search (see search/ and the README).
# Typesense (GPL-3.0), run as a separate service; the site only talks to it over HTTP.
services:
  typesense:
    image: typesense/typesense:30.2
    command: ["--data-dir", "/data", "--enable-cors"]
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY in .env}
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data

volumes:
  typesense-data:
